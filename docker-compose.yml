services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flashlink
      POSTGRES_PASSWORD: flashlink
      POSTGRES_DB: flashlink
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

volumes:
  pgdata:
  redisdata: